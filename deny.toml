[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained; it comes with ab_glyph, which must stay compatible with
    # image/imageproc (AGENTS.md). Revisit when ab_glyph moves to another parser.
    { id = "RUSTSEC-2026-0192", reason = "no maintained ab_glyph release yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
