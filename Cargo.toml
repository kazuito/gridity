[package]
name = "gridity"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Arrange PDF pages, video frames and images into labeled grid sheets for LLM vision"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kazuito/gridity"
homepage = "https://github.com/kazuito/gridity"
readme = "README.md"
keywords = ["pdf", "video", "grid", "llm", "contact-sheet"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]
exclude = ["samples/", ".claude/"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hayro = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "rayon"] }
imageproc = { version = "0.27", default-features = false }
rayon = "1.12.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
