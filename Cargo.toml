[package]
name = "gridity"
version = "0.2.1"
edition = "2024"
rust-version = "1.92"
description = "Arrange PDF pages, video frames and images into labeled grid sheets for LLM vision"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kazuito/gridity"
homepage = "https://github.com/kazuito/gridity"
readme = "README.md"
keywords = ["pdf", "video", "grid", "llm", "contact-sheet"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]
include = ["/src/", "/assets/fonts/", "/docs/", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hayro = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "rayon"] }
rayon = "1.12.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

# Prebuilt binaries for npm: smaller and slower to build than `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
