[package]
name = "gridity"
version = "0.1.0"
edition = "2024"
description = "Arrange PDF pages, video frames and images into labeled grid sheets for LLM vision"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hayro = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "rayon"] }
imageproc = { version = "0.27", default-features = false, features = ["text"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
